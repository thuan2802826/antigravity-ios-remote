name: AntigravityRemote
options:
  bundleIdPrefix: com.antigravity
targets:
  AntigravityRemote:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: .
        includes:
          - AntigravityApp.swift
          - Assets.xcassets
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "Antigravity"
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSMicrophoneUsageDescription: "Antigravity cần quyền truy cập Microphone để ghi âm giọng nói và gửi lệnh thoại đến AI."
        NSSpeechRecognitionUsageDescription: "Cần quyền nhận dạng giọng nói để chuyển lời nói của bạn thành tin nhắn văn bản gửi tới Antigravity."
        NSCameraUsageDescription: "Cần quyền Camera để chụp và gửi hình ảnh đính kèm cho AI."
        NSPhotoLibraryUsageDescription: "Cần quyền Thư viện ảnh để tải lên hình ảnh phân tích cho AI."